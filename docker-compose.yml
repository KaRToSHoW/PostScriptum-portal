services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psportal}
      POSTGRES_USER: ${POSTGRES_USER:-psportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psportal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Доступен только с самого сервера (через SSH-туннель: ssh -L 5050:127.0.0.1:5050 ...).
  # Docker публикует порты в обход ufw, поэтому привязка к 127.0.0.1 обязательна.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_cont
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?Задайте PGADMIN_PASSWORD в .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-psportal}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-psportal}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      APP_JWT_SECRET: ${JWT_SECRET}
      APP_JWT_EXPIRATION_MS: 2592000000
      APP_MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY}
      APP_UPLOAD_DIR: /app/uploads
      APP_S3_ENABLED: ${S3_ENABLED:-false}
      APP_S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.twcstorage.ru}
      APP_S3_REGION: ${S3_REGION:-ru-1}
      APP_S3_BUCKET: ${S3_BUCKET:-}
      APP_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      APP_S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      APP_S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # Медиасервер LiveKit (разворачивается на отдельном сервере, см. deploy/livekit)
      APP_LIVEKIT_URL: ${LIVEKIT_URL:-}
      APP_LIVEKIT_API_URL: ${LIVEKIT_API_URL:-}
      APP_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      APP_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Ученик считается присутствовавшим, если пробыл на занятии не меньше этой доли длительности
      APP_ATTENDANCE_THRESHOLD_PERCENT: ${ATTENDANCE_THRESHOLD_PERCENT:-50}
      # Списывать ли занятие с отсутствовавшего ученика (неявка без отмены)
      APP_BILLING_CHARGE_ABSENT: ${BILLING_CHARGE_ABSENT:-true}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost}
      # APP_-префикс обязателен: Spring маппит APP_OAUTH_* → app.oauth.* (на сервере нет application.yml)
      APP_OAUTH_FRONTEND_URL: ${OAUTH_FRONTEND_URL:-http://localhost:5173}
      APP_OAUTH_VK_CLIENT_ID: ${OAUTH_VK_CLIENT_ID:-}
      APP_OAUTH_VK_CLIENT_SECRET: ${OAUTH_VK_CLIENT_SECRET:-}
      APP_OAUTH_VK_REDIRECT_URI: ${OAUTH_VK_REDIRECT_URI:-}
      APP_OAUTH_YANDEX_CLIENT_ID: ${OAUTH_YANDEX_CLIENT_ID:-}
      APP_OAUTH_YANDEX_CLIENT_SECRET: ${OAUTH_YANDEX_CLIENT_SECRET:-}
      APP_OAUTH_YANDEX_REDIRECT_URI: ${OAUTH_YANDEX_REDIRECT_URI:-}
      # SMTP для писем сброса пароля (если пусто — ссылка пишется в лог)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      APP_MAIL_FROM: ${MAIL_FROM:-no-reply@postscriptum-online.ru}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

  # Видеосвязь перенесена на медиасервер LiveKit со встроенным TURN (deploy/livekit),
  # отдельный coturn больше не нужен.

  # Просмотр логов — только с самого сервера (SSH-туннель), см. комментарий у pgadmin.
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:8888:8080"

volumes:
  db_data:
  pgadmin_data:
  uploads_data: