# Конфигурация медиасервера LiveKit. Ключи API передаются переменной LIVEKIT_KEYS.
port: 7880            # API и сигнализация (за Caddy, наружу не открывается)
log_level: info

rtc:
  tcp_port: 7881      # для участников, у которых закрыт UDP
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true

# Встроенный TURN — для пользователей за строгим NAT и межсетевыми экранами
turn:
  enabled: true
  domain: livekit.example.ru          # заменить на LIVEKIT_DOMAIN
  udp_port: 3478
  tls_port: 5349
  # сертификат выпускает Caddy (общий том caddy_data)
  cert_file: /certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/livekit.example.ru/livekit.example.ru.crt
  key_file:  /certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/livekit.example.ru/livekit.example.ru.key

room:
  empty_timeout: 300  # комната закрывается через 5 минут после ухода последнего участника
  max_participants: 10

# Веб-хуки о входе и выходе участников → учёт посещаемости в портале.
# api_key должен совпадать с ключом из LIVEKIT_KEYS.
webhook:
  api_key: REPLACE_WITH_API_KEY
  urls:
    - https://portal.example.ru/api/conference/livekit/webhook
