# Медиасервер LiveKit для видеоконференций занятий.
# Разворачивается на ОТДЕЛЬНОМ сервере (через него идёт весь аудио/видео трафик).
#
#   cp .env.example .env   # заполнить LIVEKIT_KEYS и домен
#   docker compose up -d
#
# Открыть в файрволе: 443/tcp (wss через Caddy), 7881/tcp, 50000-60000/udp,
# 3478/udp и 5349/tcp (встроенный TURN). Порт 7880 наружу НЕ открывать.
services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    environment:
      # "API_KEY: API_SECRET" — та же пара указывается в .env сервера приложений
      LIVEKIT_KEYS: ${LIVEKIT_KEYS:?Задайте LIVEKIT_KEYS в .env}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - caddy_data:/certs:ro

  # TLS для wss://<домен> и сертификат для TURN/TLS (Let's Encrypt, выпускается автоматически)
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?Задайте LIVEKIT_DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
